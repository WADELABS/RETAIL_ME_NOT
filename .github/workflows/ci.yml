name: ECOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0' # Exact version matching local verified environment

      - name: Log Environment Metadata
        run: |
          echo "=== ENVIRONMENT INFO ==="
          node --version
          npm --version
          echo "========================"

      - name: Install dependencies
        run: npm install

      - name: Run ECOS Verification & Test Suite
        run: |
          echo "=== STARTING SYSTEM-WIDE VERIFICATION ===" > ecos-test-execution.log
          
          echo "1. Running root legacy Jest tests..." | tee -a ecos-test-execution.log
          npx jest 2>&1 | tee -a ecos-test-execution.log
          
          echo "2. Running API and Event Contract tests..." | tee -a ecos-test-execution.log
          npm run test:contracts 2>&1 | tee -a ecos-test-execution.log
          
          echo "3. Running Golden Path Transaction Simulation..." | tee -a ecos-test-execution.log
          npm run test:simulation 2>&1 | tee -a ecos-test-execution.log
          
          echo "4. Running Catalog Ingestion & Product Matching tests..." | tee -a ecos-test-execution.log
          npm run test:ingestion 2>&1 | tee -a ecos-test-execution.log
          
          echo "5. Running Sourcing & Pricing Optimization tests..." | tee -a ecos-test-execution.log
          npm run test:optimization 2>&1 | tee -a ecos-test-execution.log
          
          echo "6. Running Closed-Loop Adaptive Learning tests..." | tee -a ecos-test-execution.log
          npm run test:learning 2>&1 | tee -a ecos-test-execution.log
          
          echo "7. Running Real-time Telemetry Surge Pricing tests..." | tee -a ecos-test-execution.log
          npm run test:telemetry 2>&1 | tee -a ecos-test-execution.log
          
          echo "8. Running platform-core legacy backend tests..." | tee -a ecos-test-execution.log
          npm test --prefix platform-core/backend 2>&1 | tee -a ecos-test-execution.log
          
          echo "=== VERIFICATION COMPLETE ===" >> ecos-test-execution.log

      - name: Upload Test Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecos-test-execution-log
          path: ecos-test-execution.log
